name: Publish dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "map.json"]

concurrency:
  group: pages
  cancel-in-progress: false  # finish each deploy; GitHub keeps only the newest one waiting

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp page version
        run: |
          # version = hash of the page itself, so open pages reload only when the page changes, not on every data update
          v=$(cat index.html map.json | sha1sum | cut -c1-7)
          echo "$v" > version.txt
          sed -i "s/__BUILD__/$v/" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
