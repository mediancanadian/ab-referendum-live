name: Publish dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html"]

concurrency:
  group: pages
  cancel-in-progress: false  # finish each deploy; GitHub keeps only the newest one waiting

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
