name: Update results

# One long run fetches every 20 seconds for up to ~5h50m.
# The 5-minute schedule only restarts it if it has stopped (concurrency keeps one at a time).
# Counting finished, so the schedule is off. Run it by hand from the Actions tab if needed.
on:
  workflow_dispatch:

concurrency:
  group: updater
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Fetch every minute and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          cp data.json /tmp/data.json 2>/dev/null || true
          end=$(( $(date +%s) + 350*60 ))
          last_pub=0
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            if res=$(python3 scripts/fetch.py /tmp/data.json 2>&1); then
              echo "$(date -u +%H:%M:%S) $res"
              now=$(date +%s)
              # publish when numbers change, and at least every 3 minutes so "checked" stays fresh
              if [[ "$res" == CHANGED* ]] || [ $((now-last_pub)) -ge 180 ]; then
                # data.json is rewritten in full each time, so start from the latest main instead of merging
                git rebase --abort 2>/dev/null || true
                if git fetch -q origin main && git reset -q --hard origin/main; then
                  cp /tmp/data.json data.json
                  git add data.json
                  git commit -q -m "Results: ${res#* }" || true
                  git push -q origin HEAD:main && gh workflow run pages.yml --ref main && last_pub=$now
                fi
              fi
            else
              echo "$(date -u +%H:%M:%S) fetch failed: $(echo "$res" | tail -1)"
            fi
            sleep $(( 20 - ($(date +%s) - start) > 0 ? 20 - ($(date +%s) - start) : 1 ))
          done
